<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>LethorPOS | Portada Facebook (1640x924)</title>
  <link rel="stylesheet" href="../assets/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="../assets/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="../assets/fontawesome/css/brands.min.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <style>
    html, body {
      margin: 0;
      width: 1640px;
      height: 924px;
      overflow: hidden;
      background: var(--ink-950);
    }

    * { box-sizing: border-box; }

    /*
     * Zonas (lienzo 1640x924):
     * - Celular: se ve completo (16:9).
     * - Escritorio: solo la franja central y = 158..765.
     * - Círculo de perfil en la app: esquina inferior izquierda, aprox. x < 520, y > 584.
     */
    .portada {
      position: relative;
      width: 1640px;
      height: 924px;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--on-dark);
      background: linear-gradient(135deg, var(--ink-900) 0%, var(--ink-950) 60%);
    }

    .foto {
      position: absolute;
      top: 0;
      right: 0;
      width: 900px;
      height: 924px;
      overflow: hidden;
    }

    .foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 75% 30%;
    }

    .foto::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, var(--ink-950) 0%, rgba(7, 13, 26, 0.85) 14%, rgba(7, 13, 26, 0.2) 42%, rgba(7, 13, 26, 0) 60%),
        linear-gradient(0deg, rgba(7, 13, 26, 0.75) 0%, rgba(7, 13, 26, 0) 35%),
        linear-gradient(180deg, rgba(7, 13, 26, 0.45) 0%, rgba(7, 13, 26, 0) 22%);
    }

    .brillo {
      position: absolute;
      width: 1100px;
      height: 1100px;
      left: -380px;
      top: -260px;
      background: radial-gradient(circle, rgba(26, 108, 240, 0.42) 0%, rgba(26, 108, 240, 0) 62%);
    }

    .brillo-cian {
      position: absolute;
      width: 900px;
      height: 900px;
      left: -260px;
      bottom: -560px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.22) 0%, rgba(34, 211, 238, 0) 62%);
    }

    .puntos {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(148, 163, 184, 0.2) 2px, transparent 2px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(ellipse at 20% 70%, #000 0%, transparent 55%);
      mask-image: radial-gradient(ellipse at 20% 70%, #000 0%, transparent 55%);
    }

    .copy {
      position: absolute;
      left: 90px;
      top: 180px;
      width: 820px;
    }

    .logo {
      display: block;
      width: 370px;
      height: auto;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 80px;
      line-height: 1.08;
      letter-spacing: -2px;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 6px 30px rgba(7, 13, 26, 0.6);
    }

    .text-gradient {
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    .plataformas {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      margin-top: 22px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 28px;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(7, 13, 26, 0.9);
    }

    .plataforma {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px;
      border-radius: var(--radius-sm);
      background: rgba(19, 33, 59, 0.85);
      border: 2px solid rgba(148, 163, 184, 0.28);
      text-shadow: none;
      color: #ffffff;
      font-weight: 700;
    }

    .plataforma i {
      font-size: 34px;
    }

    .fa-windows { color: #38bdf8; }
    .fa-android { color: #3ddc84; }

    .chip {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 28px;
      border-radius: var(--radius-pill);
      background: rgba(19, 33, 59, 0.82);
      border: 2px solid rgba(148, 163, 184, 0.28);
      backdrop-filter: blur(12px);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 37px;
      color: #ffffff;
      box-shadow: 0 12px 32px rgba(7, 13, 26, 0.45);
      white-space: nowrap;
    }

    .chip i {
      color: var(--accent-cyan);
    }

    .chips-tipo {
      position: absolute;
      right: 60px;
      top: 176px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
    }

    .chips-tipo .chip {
      position: static;
    }

    .cta {
      position: absolute;
      right: 60px;
      top: 470px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 20px 34px;
      border-radius: var(--radius-pill);
      background: var(--gradient-brand);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 38px;
      color: #ffffff;
      box-shadow: var(--shadow-glow), 0 0 0 4px rgba(255, 255, 255, 0.12);
      white-space: nowrap;
    }

    .url {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 44px;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(7, 13, 26, 0.9);
    }
  </style>
</head>
<body>
  <div class="portada">
    <div class="foto">
      <img src="../assets/img/hero-mesera.jpg" alt="">
    </div>
    <div class="brillo"></div>
    <div class="brillo-cian"></div>
    <div class="puntos"></div>

    <div style="margin-left:60px; margin-top:-40px;" class="copy">
      <img class="logo" src="../assets/marca/logo-claro.svg" alt="LethorPOS">
      <h1>Vende más <span class="text-gradient">
	  <br/> rápido</span>,<br>¡sin 
	  <br />
	  <span class="text-gradient">internet</span>!</h1>
      <div class="plataformas">
        <span class="plataforma"><i class="fa-brands fa-windows"></i> Windows</span>
        <span class="plataforma"><i class="fa-brands fa-android"></i> Android</span>
      </div>
    </div>

    <div style="position:relative; top:50px; right:80px;" class="chips-tipo">
      <span class="chip"><i class="fa-solid fa-utensils"></i> Restaurantes</span>
      <span class="chip"><i class="fa-solid fa-store"></i> Tiendas</span>
    </div>

    <div style="margin-top:-30px;" class="cta">
      <span style="margin-left:10px;" class="btn">Prueba gratis 14 días <i class="fa-solid fa-arrow-right"></i></span>
      <span style="margin-left:10px;" class="url">lethorpos.com</span>
    </div>
  </div>
</body>
</html>
